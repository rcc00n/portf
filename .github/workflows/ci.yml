name: Regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Definition and inquiry browser regression
        env:
          RACCN_TEST_URL: http://127.0.0.1:4173
        run: |
          npm --prefix app run preview -- --host 127.0.0.1 --port 4173 > /tmp/raccn-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/start/define > /dev/null; then break; fi
            sleep 1
          done
          python app/tests/definition_browser.py

  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'false'
      DJANGO_DB_SSL: 'false'
      DJANGO_SECURE_SSL_REDIRECT: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:////tmp/raccn-ci.sqlite3
      TELEGRAM_BOT_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python manage.py test
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
